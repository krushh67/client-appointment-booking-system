apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-booking-frontend
  labels:
    app: appointment-booking-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-booking-frontend
  template:
    metadata:
      labels:
        app: appointment-booking-frontend
        tier: frontend
    spec:
      containers:
        - name: appointment-booking-frontend
          image: appointment-booking-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
